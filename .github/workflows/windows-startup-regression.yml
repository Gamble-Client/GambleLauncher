name: Windows startup regression

on:
  workflow_dispatch:
  push:
    branches: [main, codex/launcher-ui-security-pass-20260821]
    paths:
      - .github/workflows/windows-startup-regression.yml
      - src/**
      - src-tauri/**
      - tests/**

permissions:
  contents: read

jobs:
  startup:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - name: Delayed-exit UI regressions and frontend build
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed." }
          npm test
          if ($LASTEXITCODE -ne 0) { throw "UI regression tests failed." }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "Frontend build failed." }
      # The publishing Windows build also runs all these Rust tests before
      # packaging/uploading. This quick workflow never uploads release objects.
      - name: Real JVM lifecycle and native regression tests
        shell: pwsh
        working-directory: src-tauri
        run: |
          cargo test -- --nocapture 2>&1 | Tee-Object -FilePath windows-startup-tests.log
          if ($LASTEXITCODE -ne 0) { throw "Native startup regression tests failed." }
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-startup-tests
          path: src-tauri/windows-startup-tests.log
          if-no-files-found: warn
