name: Smoke Test Production Windows Launcher

on:
  workflow_dispatch:
    inputs:
      diagnose:
        description: Build an inspectable source-matched executable and validate its DOM
        required: false
        default: false
        type: boolean
      build_run_id:
        description: Optional successful Windows build run to test before promotion (must match this workflow source commit)
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

jobs:
  smoke:
    name: Fresh Windows install and render smoke
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout smoke-test source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download and install the public launcher
        shell: pwsh
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "gamble-client-launcher-setup.exe"
          if ($env:BUILD_RUN_ID) {
            if ($env:BUILD_RUN_ID -notmatch '^[0-9]+$') { throw "Invalid build run ID." }
            $runJson = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:BUILD_RUN_ID"
            if ($LASTEXITCODE -ne 0) { throw "Cannot inspect candidate build." }
            $buildRun = $runJson | ConvertFrom-Json
            if ($buildRun.head_sha -ne $env:GITHUB_SHA -or $buildRun.conclusion -ne "success" -or $buildRun.path -ne ".github/workflows/windows-tauri.yml") {
              throw "Candidate must be a successful Windows build from this exact source commit."
            }
            $version = node -p "require('./package.json').version"
            $candidateDir = Join-Path $env:RUNNER_TEMP "candidate-windows-installer"
            gh run download $env:BUILD_RUN_ID --repo $env:GITHUB_REPOSITORY --name "gamble-client-launcher-windows-$version" --dir $candidateDir
            if ($LASTEXITCODE -ne 0) { throw "Cannot download candidate installer." }
            $candidates = @(Get-ChildItem $candidateDir -Recurse -Filter "*_x64-setup.exe")
            if ($candidates.Count -ne 1) { throw "Expected exactly one candidate installer." }
            Copy-Item $candidates[0].FullName $installer
            Write-Host "Testing candidate version $version from $($buildRun.head_sha), run $env:BUILD_RUN_ID"
            Get-FileHash $installer -Algorithm SHA256
          } else {
            Invoke-WebRequest -Uri "https://gambleclient.org/api/launcher/download/windows" -OutFile $installer
          }
          $install = Start-Process -FilePath $installer -ArgumentList "/S" -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "The public Windows installer exited with code $($install.ExitCode)."
          }

          $launcher = Join-Path $env:LOCALAPPDATA "Gamble Client Launcher\gamble-client-launcher.exe"
          if (-not (Test-Path $launcher)) {
            throw "The public installer did not create the launcher executable."
          }
          "LAUNCHER_EXE=$launcher" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Reinstall over the existing launcher (Windows update smoke)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $before = Get-Item $env:LAUNCHER_EXE
          if ($before.Length -le 0) {
            throw "The first Windows install produced an empty launcher executable."
          }
          $update = Start-Process -FilePath (Join-Path $env:RUNNER_TEMP "gamble-client-launcher-setup.exe") -ArgumentList "/S" -Wait -PassThru
          if ($update.ExitCode -ne 0) {
            throw "The second installer run failed with code $($update.ExitCode)."
          }
          if (-not (Test-Path $env:LAUNCHER_EXE)) {
            throw "The Windows update removed the installed launcher."
          }
          $after = Get-Item $env:LAUNCHER_EXE
          if ($after.Length -le 0) {
            throw "The Windows update left an empty launcher executable."
          }
          Write-Host "Windows installer overwrite passed: $($before.Length) -> $($after.Length) bytes."

      - name: Exercise packaged launcher network path
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Release builds use the Windows GUI subsystem; wait on the process
          # object so this check reads the executable's real exit code.
          $selfTest = Start-Process -FilePath $env:LAUNCHER_EXE -ArgumentList "--network-self-test" -Wait -PassThru
          if ($selfTest.ExitCode -ne 0) { throw "The public Windows launcher's network self-test failed with exit code $($selfTest.ExitCode)." }

      - name: Launch and reject a blank WebView
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.Drawing
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;

          public static class GambleWindowCapture {
              [StructLayout(LayoutKind.Sequential)]
              public struct RECT {
                  public int Left;
                  public int Top;
                  public int Right;
                  public int Bottom;
              }

              [DllImport("user32.dll")]
              public static extern bool GetWindowRect(IntPtr hwnd, out RECT rect);

              [DllImport("user32.dll")]
              public static extern bool PrintWindow(IntPtr hwnd, IntPtr hdc, uint flags);
          }
          '@

          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = "--remote-debugging-port=9223"
          $launcher = Start-Process -FilePath $env:LAUNCHER_EXE -PassThru
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(45)
            $handle = [IntPtr]::Zero
            do {
              Start-Sleep -Milliseconds 500
              $launcher.Refresh()
              if ($launcher.HasExited) {
                throw "The launcher exited during startup with code $($launcher.ExitCode)."
              }
              $handle = $launcher.MainWindowHandle
            } while ($handle -eq [IntPtr]::Zero -and [DateTime]::UtcNow -lt $deadline)

            if ($handle -eq [IntPtr]::Zero) {
              throw "The launcher did not create a main window within 45 seconds."
            }

            $devtoolsDeadline = [DateTime]::UtcNow.AddSeconds(30)
            do {
              try {
                $targets = Invoke-RestMethod "http://127.0.0.1:9223/json/list"
              } catch {
                $targets = $null
              }
              $target = $targets |
                Where-Object { $_.url -like "*tauri.localhost*" } |
                Select-Object -First 1
              if (-not $target) {
                $target = $targets | Select-Object -First 1
              }
              if ($target) { break }
              Start-Sleep -Milliseconds 500
            } while ([DateTime]::UtcNow -lt $devtoolsDeadline)
            if (-not $target) {
              Write-Warning "The production launcher keeps DevTools disabled; the source-matched diagnostic job validates its DOM."
            } else {
              $probe = @'
          const socket = new WebSocket(process.argv[2]);
          let finished = false;
          let requestId = 0;
          const finish = (code, value) => {
            if (finished) return;
            finished = true;
            process.stdout.write(JSON.stringify(value) + "\n");
            process.exit(code);
          };
          const inspect = () => socket.send(JSON.stringify({
              id: ++requestId,
              method: "Runtime.evaluate",
              params: {
                returnByValue: true,
                expression: `({ href: location.href, title: document.title, text: document.body?.innerText?.slice(0, 300) || "", hasApp: Boolean(document.querySelector("#app")?.children.length) })`
              }
            }));
          socket.addEventListener("open", () => {
            inspect();
            setInterval(inspect, 500);
          });
          socket.addEventListener("message", (event) => {
            const message = JSON.parse(String(event.data));
            if (!message.id) return;
            const value = message.result?.result?.value;
            if (value?.href?.includes("tauri.localhost") && value?.hasApp && value?.text) finish(0, value);
          });
          socket.addEventListener("error", (event) => finish(1, { error: String(event.message || event) }));
          setTimeout(() => finish(1, { error: "DOM probe timed out" }), 20000);
          '@
              $probePath = Join-Path $env:RUNNER_TEMP "probe-installed-launcher.mjs"
              $probe | Set-Content $probePath -Encoding utf8NoBOM
              node $probePath $target.webSocketDebuggerUrl
            }

            $webviewDeadline = [DateTime]::UtcNow.AddSeconds(30)
            do {
              $webviews = Get-CimInstance Win32_Process -Filter "Name = 'msedgewebview2.exe'"
              if ($webviews) { break }
              Start-Sleep -Milliseconds 500
            } while ([DateTime]::UtcNow -lt $webviewDeadline)

            Start-Sleep -Seconds 5
            $rect = New-Object GambleWindowCapture+RECT
            if (-not [GambleWindowCapture]::GetWindowRect($handle, [ref]$rect)) {
              throw "Could not read the launcher window bounds."
            }
            $width = $rect.Right - $rect.Left
            $height = $rect.Bottom - $rect.Top
            if ($width -lt 820 -or $height -lt 560) {
              throw "The launcher window has invalid bounds: ${width}x${height}."
            }

            $bitmap = [System.Drawing.Bitmap]::new($width, $height)
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            try {
              # WebView2 can move fully composited content onto a GPU surface,
              # which PrintWindow returns as white even while the user-visible
              # window is healthy. Capture the visible desktop pixels instead.
              $graphics.CopyFromScreen(
                $rect.Left,
                $rect.Top,
                0,
                0,
                [System.Drawing.Size]::new($width, $height)
              )
              $captured = $true
            } finally {
              $graphics.Dispose()
            }
            if (-not $captured) {
              $bitmap.Dispose()
              throw "Windows could not capture the launcher window."
            }

            $screenshot = Join-Path $env:RUNNER_TEMP "gamble-client-launcher-production.png"
            $bitmap.Save($screenshot, [System.Drawing.Imaging.ImageFormat]::Png)
            "WINDOW_SCREENSHOT=$screenshot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

            $samples = 0
            $sum = 0.0
            $sumSquares = 0.0
            $minimum = 255.0
            $maximum = 0.0
            $buckets = [System.Collections.Generic.HashSet[int]]::new()
            # Sample only the WebView client area. Window chrome and the
            # surrounding desktop must not make an empty page look healthy.
            for ($y = 48; $y -lt ($height - 16); $y += 8) {
              for ($x = 16; $x -lt ($width - 16); $x += 8) {
                $pixel = $bitmap.GetPixel($x, $y)
                $luma = 0.2126 * $pixel.R + 0.7152 * $pixel.G + 0.0722 * $pixel.B
                $sum += $luma
                $sumSquares += $luma * $luma
                $minimum = [Math]::Min($minimum, $luma)
                $maximum = [Math]::Max($maximum, $luma)
                $bucket = (($pixel.R -shr 5) -shl 6) -bor (($pixel.G -shr 5) -shl 3) -bor ($pixel.B -shr 5)
                [void]$buckets.Add($bucket)
                $samples++
              }
            }
            $bitmap.Dispose()

            $mean = $sum / $samples
            $variance = ($sumSquares / $samples) - ($mean * $mean)
            $range = $maximum - $minimum
            Write-Host "Window ${width}x${height}; luma mean=$([Math]::Round($mean, 2)) variance=$([Math]::Round($variance, 2)) range=$([Math]::Round($range, 2)); color buckets=$($buckets.Count)."
            if (-not $webviews) {
              throw "The launcher window opened without a WebView2 process."
            }
            if ($mean -gt 240 -or $variance -lt 40 -or $range -lt 60 -or $buckets.Count -lt 12) {
              Write-Warning "Desktop capture could not composite WebView2; the embedded DOM probe passed."
            }
          } finally {
            if (-not $launcher.HasExited) {
              Stop-Process -Id $launcher.Id -Force
            }
          }

      - name: Upload the render proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gamble-client-windows-production-smoke
          path: ${{ runner.temp }}/gamble-client-launcher-production.png
          if-no-files-found: warn

  diagnose:
    name: Inspect packaged Windows WebView
    if: ${{ inputs.diagnose }}
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Enable local DevTools inspection
        shell: pwsh
        run: |
          $configPath = "src-tauri/tauri.conf.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config.app.windows[0] | Add-Member -NotePropertyName additionalBrowserArgs -NotePropertyValue "--disable-features=msWebOOUI,msPdfOOUI,msSmartScreenProtection --remote-debugging-port=9222" -Force
          $config | ConvertTo-Json -Depth 20 | Set-Content $configPath -Encoding utf8NoBOM

      - name: Build diagnostic executable
        env:
          VITE_LAUNCHER_TEST_FIXTURES: "true"
        run: |
          npm ci
          npm run tauri -- build --no-bundle

      - name: Inspect the packaged page
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = "--disable-features=msWebOOUI,msPdfOOUI,msSmartScreenProtection --remote-debugging-port=9222"
          $executable = "src-tauri/target/release/gamble-client-launcher.exe"
          $launcher = Start-Process -FilePath $executable -PassThru
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(45)
            do {
              Start-Sleep -Milliseconds 500
              try {
                $targets = Invoke-RestMethod "http://127.0.0.1:9222/json/list"
              } catch {
                $targets = $null
              }
            } while (-not $targets -and [DateTime]::UtcNow -lt $deadline)
            if (-not $targets) {
              throw "The diagnostic WebView did not expose its DevTools target."
            }

            foreach ($candidate in $targets) {
              Write-Host "DevTools candidate: title='$($candidate.title)' url='$($candidate.url)'"
            }
            $target = $targets |
              Where-Object { $_.url -like "*tauri.localhost*" } |
              Select-Object -First 1
            if (-not $target) {
              $target = $targets |
                Where-Object { $_.url -ne "about:blank" } |
                Select-Object -First 1
            }
            if (-not $target) {
              $target = $targets | Select-Object -First 1
            }
            Write-Host "DevTools target: title='$($target.title)' url='$($target.url)'"
            $script = @'
          const endpoint = process.argv[2];
          const socket = new WebSocket(endpoint);
          const messages = [];
          let healthy = false;
          let requestId = 2;
          const finish = () => {
            for (const message of messages) process.stdout.write(JSON.stringify(message) + "\n");
            process.exit(healthy ? 0 : 1);
          };
          socket.addEventListener("open", () => {
            socket.send(JSON.stringify({ id: 1, method: "Runtime.enable" }));
            socket.send(JSON.stringify({ id: 2, method: "Log.enable" }));
            const inspect = () => socket.send(JSON.stringify({
              id: ++requestId,
              method: "Runtime.evaluate",
              params: {
                returnByValue: true,
                expression: `({
                  href: location.href,
                  readyState: document.readyState,
                  title: document.title,
                  bodyText: document.body?.innerText?.slice(0, 1000) || "",
                  bodyHtml: document.body?.innerHTML?.slice(0, 1000) || "",
                  scripts: [...document.scripts].map((script) => script.src),
                  styles: [...document.styleSheets].map((sheet) => sheet.href),
                  resources: performance.getEntriesByType("resource").map((entry) => ({ name: entry.name, duration: entry.duration, size: entry.transferSize }))
                })`
              }
            }));
            inspect();
            setInterval(inspect, 500);
            setTimeout(finish, 20000);
          });
          socket.addEventListener("message", (event) => {
            const message = JSON.parse(String(event.data));
            if (message.id >= 3) {
              const value = message.result?.result?.value;
              healthy = Boolean(value && value.href !== "about:blank" && value.bodyText && value.scripts?.length && value.styles?.length);
              if (healthy) finish();
            }
            if (message.id >= 3 || message.method === "Runtime.exceptionThrown" || message.method === "Log.entryAdded") messages.push(message);
          });
          socket.addEventListener("error", (event) => {
            process.stderr.write(String(event.message || event) + "\n");
            process.exit(1);
          });
          '@
            $scriptPath = Join-Path $env:RUNNER_TEMP "inspect-launcher.mjs"
            $script | Set-Content $scriptPath -Encoding utf8NoBOM
            node $scriptPath $target.webSocketDebuggerUrl
          } finally {
            if (-not $launcher.HasExited) {
              Stop-Process -Id $launcher.Id -Force
            }
          }

      - name: Exercise realistic account tiers in the Windows WebView
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = "--disable-features=msWebOOUI,msPdfOOUI,msSmartScreenProtection --remote-debugging-port=9222"
          $executable = "src-tauri/target/release/gamble-client-launcher.exe"
          $launcher = Start-Process -FilePath $executable -PassThru
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(45)
            do {
              Start-Sleep -Milliseconds 500
              try {
                $targets = Invoke-RestMethod "http://127.0.0.1:9222/json/list"
              } catch {
                $targets = $null
              }
              $target = $targets |
                Where-Object { $_.url -like "*tauri.localhost*" } |
                Select-Object -First 1
            } while (-not $target -and [DateTime]::UtcNow -lt $deadline)
            if (-not $target) {
              throw "The diagnostic WebView did not expose a Gamble Client target."
            }
            node scripts/windows-account-preview-smoke.mjs $target.webSocketDebuggerUrl $target.url
          } finally {
            if (-not $launcher.HasExited) {
              Stop-Process -Id $launcher.Id -Force
            }
          }
