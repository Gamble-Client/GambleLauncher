name: Smoke Test Production Windows Launcher

on:
  workflow_dispatch:

jobs:
  smoke:
    name: Fresh Windows install and render smoke
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Download and install the public launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "gamble-client-launcher-setup.exe"
          Invoke-WebRequest -Uri "https://gamble-client.store/api/launcher/download/windows" -OutFile $installer
          $install = Start-Process -FilePath $installer -ArgumentList "/S" -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "The public Windows installer exited with code $($install.ExitCode)."
          }

          $launcher = Join-Path $env:LOCALAPPDATA "Gamble Client Launcher\gamble-client-launcher.exe"
          if (-not (Test-Path $launcher)) {
            throw "The public installer did not create the launcher executable."
          }
          "LAUNCHER_EXE=$launcher" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Launch and reject a blank WebView
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.Drawing
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;

          public static class GambleWindowCapture {
              [StructLayout(LayoutKind.Sequential)]
              public struct RECT {
                  public int Left;
                  public int Top;
                  public int Right;
                  public int Bottom;
              }

              [DllImport("user32.dll")]
              public static extern bool GetWindowRect(IntPtr hwnd, out RECT rect);

              [DllImport("user32.dll")]
              public static extern bool PrintWindow(IntPtr hwnd, IntPtr hdc, uint flags);
          }
          '@

          $launcher = Start-Process -FilePath $env:LAUNCHER_EXE -PassThru
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(45)
            $handle = [IntPtr]::Zero
            do {
              Start-Sleep -Milliseconds 500
              $launcher.Refresh()
              if ($launcher.HasExited) {
                throw "The launcher exited during startup with code $($launcher.ExitCode)."
              }
              $handle = $launcher.MainWindowHandle
            } while ($handle -eq [IntPtr]::Zero -and [DateTime]::UtcNow -lt $deadline)

            if ($handle -eq [IntPtr]::Zero) {
              throw "The launcher did not create a main window within 45 seconds."
            }

            $webviewDeadline = [DateTime]::UtcNow.AddSeconds(30)
            do {
              $webviews = Get-CimInstance Win32_Process -Filter "Name = 'msedgewebview2.exe'"
              if ($webviews) { break }
              Start-Sleep -Milliseconds 500
            } while ([DateTime]::UtcNow -lt $webviewDeadline)

            Start-Sleep -Seconds 5
            $rect = New-Object GambleWindowCapture+RECT
            if (-not [GambleWindowCapture]::GetWindowRect($handle, [ref]$rect)) {
              throw "Could not read the launcher window bounds."
            }
            $width = $rect.Right - $rect.Left
            $height = $rect.Bottom - $rect.Top
            if ($width -lt 820 -or $height -lt 560) {
              throw "The launcher window has invalid bounds: ${width}x${height}."
            }

            $bitmap = [System.Drawing.Bitmap]::new($width, $height)
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            try {
              # WebView2 can move fully composited content onto a GPU surface,
              # which PrintWindow returns as white even while the user-visible
              # window is healthy. Capture the visible desktop pixels instead.
              $graphics.CopyFromScreen(
                $rect.Left,
                $rect.Top,
                0,
                0,
                [System.Drawing.Size]::new($width, $height)
              )
              $captured = $true
            } finally {
              $graphics.Dispose()
            }
            if (-not $captured) {
              $bitmap.Dispose()
              throw "Windows could not capture the launcher window."
            }

            $screenshot = Join-Path $env:RUNNER_TEMP "gamble-client-launcher-production.png"
            $bitmap.Save($screenshot, [System.Drawing.Imaging.ImageFormat]::Png)
            "WINDOW_SCREENSHOT=$screenshot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

            $samples = 0
            $sum = 0.0
            $sumSquares = 0.0
            $minimum = 255.0
            $maximum = 0.0
            $buckets = [System.Collections.Generic.HashSet[int]]::new()
            # Sample only the WebView client area. Window chrome and the
            # surrounding desktop must not make an empty page look healthy.
            for ($y = 48; $y -lt ($height - 16); $y += 8) {
              for ($x = 16; $x -lt ($width - 16); $x += 8) {
                $pixel = $bitmap.GetPixel($x, $y)
                $luma = 0.2126 * $pixel.R + 0.7152 * $pixel.G + 0.0722 * $pixel.B
                $sum += $luma
                $sumSquares += $luma * $luma
                $minimum = [Math]::Min($minimum, $luma)
                $maximum = [Math]::Max($maximum, $luma)
                $bucket = (($pixel.R -shr 5) -shl 6) -bor (($pixel.G -shr 5) -shl 3) -bor ($pixel.B -shr 5)
                [void]$buckets.Add($bucket)
                $samples++
              }
            }
            $bitmap.Dispose()

            $mean = $sum / $samples
            $variance = ($sumSquares / $samples) - ($mean * $mean)
            $range = $maximum - $minimum
            Write-Host "Window ${width}x${height}; luma mean=$([Math]::Round($mean, 2)) variance=$([Math]::Round($variance, 2)) range=$([Math]::Round($range, 2)); color buckets=$($buckets.Count)."
            if (-not $webviews) {
              throw "The launcher window opened without a WebView2 process."
            }
            if ($mean -gt 240 -or $variance -lt 40 -or $range -lt 60 -or $buckets.Count -lt 12) {
              throw "The launcher render is blank or nearly uniform."
            }
          } finally {
            if (-not $launcher.HasExited) {
              Stop-Process -Id $launcher.Id -Force
            }
          }

      - name: Upload the render proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gamble-client-windows-production-smoke
          path: ${{ runner.temp }}/gamble-client-launcher-production.png
          if-no-files-found: warn

  diagnose:
    name: Inspect packaged Windows WebView
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Enable local DevTools inspection
        shell: pwsh
        run: |
          $configPath = "src-tauri/tauri.conf.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config.app.windows[0] | Add-Member -NotePropertyName additionalBrowserArgs -NotePropertyValue "--remote-debugging-port=9222" -Force
          $config | ConvertTo-Json -Depth 20 | Set-Content $configPath -Encoding utf8NoBOM

      - name: Build diagnostic executable
        run: |
          npm ci
          npm run tauri -- build --no-bundle

      - name: Inspect the packaged page
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $executable = "src-tauri/target/release/gamble-client-launcher.exe"
          $launcher = Start-Process -FilePath $executable -PassThru
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(45)
            do {
              Start-Sleep -Milliseconds 500
              try {
                $targets = Invoke-RestMethod "http://127.0.0.1:9222/json/list"
              } catch {
                $targets = $null
              }
            } while (-not $targets -and [DateTime]::UtcNow -lt $deadline)
            if (-not $targets) {
              throw "The diagnostic WebView did not expose its DevTools target."
            }

            foreach ($candidate in $targets) {
              Write-Host "DevTools candidate: title='$($candidate.title)' url='$($candidate.url)'"
            }
            $target = $targets |
              Where-Object { $_.url -like "*tauri.localhost*" } |
              Select-Object -First 1
            if (-not $target) {
              $target = $targets |
                Where-Object { $_.url -ne "about:blank" } |
                Select-Object -First 1
            }
            if (-not $target) {
              $target = $targets | Select-Object -First 1
            }
            Write-Host "DevTools target: title='$($target.title)' url='$($target.url)'"
            $script = @'
          const endpoint = process.argv[2];
          const socket = new WebSocket(endpoint);
          const messages = [];
          let healthy = false;
          const finish = () => {
            for (const message of messages) process.stdout.write(JSON.stringify(message) + "\n");
            process.exit(healthy ? 0 : 1);
          };
          socket.addEventListener("open", () => {
            socket.send(JSON.stringify({ id: 1, method: "Runtime.enable" }));
            socket.send(JSON.stringify({ id: 2, method: "Log.enable" }));
            socket.send(JSON.stringify({
              id: 3,
              method: "Runtime.evaluate",
              params: {
                returnByValue: true,
                expression: `({
                  href: location.href,
                  readyState: document.readyState,
                  title: document.title,
                  bodyText: document.body?.innerText?.slice(0, 1000) || "",
                  bodyHtml: document.body?.innerHTML?.slice(0, 1000) || "",
                  scripts: [...document.scripts].map((script) => script.src),
                  styles: [...document.styleSheets].map((sheet) => sheet.href),
                  resources: performance.getEntriesByType("resource").map((entry) => ({ name: entry.name, duration: entry.duration, size: entry.transferSize }))
                })`
              }
            }));
            setTimeout(finish, 5000);
          });
          socket.addEventListener("message", (event) => {
            const message = JSON.parse(String(event.data));
            if (message.id === 3) {
              const value = message.result?.result?.value;
              healthy = Boolean(value && value.href !== "about:blank" && value.bodyText && value.scripts?.length && value.styles?.length);
            }
            if (message.id === 3 || message.method === "Runtime.exceptionThrown" || message.method === "Log.entryAdded") messages.push(message);
          });
          socket.addEventListener("error", (event) => {
            process.stderr.write(String(event.message || event) + "\n");
            process.exit(1);
          });
          '@
            $scriptPath = Join-Path $env:RUNNER_TEMP "inspect-launcher.mjs"
            $script | Set-Content $scriptPath -Encoding utf8NoBOM
            node $scriptPath $target.webSocketDebuggerUrl
          } finally {
            if (-not $launcher.HasExited) {
              Stop-Process -Id $launcher.Id -Force
            }
          }
