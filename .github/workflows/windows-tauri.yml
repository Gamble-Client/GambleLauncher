name: Build Windows Launcher

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the tested installer and release manifest to production R2
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - ".github/workflows/windows-tauri.yml"
      - "src/**"
      - "src-tauri/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify Windows file permissions
        shell: pwsh
        run: .\gradlew.bat test

      - name: Preserve Windows Java test receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-java-test-receipts
          path: build/test-results/test/*.xml
          if-no-files-found: warn

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Read package version
        id: package
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend test assets
        shell: pwsh
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { throw "Frontend regression tests failed; release build blocked." }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "Frontend build failed; release build blocked." }

      - name: Test native launcher on Windows
        working-directory: src-tauri
        run: cargo test

      - name: Build Windows bundles
        shell: pwsh
        run: |
          $workspace = (Resolve-Path ".").Path
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE ".cargo" }
          $env:RUSTFLAGS = "--remap-path-prefix=$workspace=C:/src/gamble-client-launcher --remap-path-prefix=$cargoHome=C:/rust/cargo"
          npm run tauri -- build --bundles nsis

      - name: Test packaged Windows network path
        shell: pwsh
        run: |
          $executable = Get-ChildItem "src-tauri/target/release/gamble-client-launcher.exe" | Select-Object -First 1
          if (-not $executable) { throw "The Windows launcher executable was not produced." }
          # Release builds use the Windows GUI subsystem, so PowerShell's
          # call operator can return before the process has produced its real
          # exit code. Start-Process -Wait is required for a reliable check.
          $selfTest = Start-Process -FilePath $executable.FullName -ArgumentList "--network-self-test" -Wait -PassThru
          if ($selfTest.ExitCode -ne 0) { throw "The packaged Windows launcher network self-test failed with exit code $($selfTest.ExitCode)." }

      - name: Refuse diagnostic builds
        shell: pwsh
        run: |
          # windows-production-smoke builds an inspectable exe with WebView2 remote
          # debugging. It must never reach players: fail if this build is one.
          $config = Get-Content "src-tauri/tauri.conf.json" -Raw
          if ($config -match "remote-debugging-port") { throw "tauri.conf.json enables remote debugging; release build blocked." }
          $executable = (Get-ChildItem "src-tauri/target/release/gamble-client-launcher.exe" | Select-Object -First 1).FullName
          $bytes = [System.IO.File]::ReadAllBytes($executable)
          foreach ($encoding in @([System.Text.Encoding]::ASCII, [System.Text.Encoding]::Unicode)) {
            if ($encoding.GetString($bytes).Contains("remote-debugging-port")) { throw "The executable enables remote debugging; diagnostic builds are never published." }
          }

      - name: Upload Windows installer directly to R2
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        shell: pwsh
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not produced." }
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          $manifestName = "launcher-windows-${{ steps.package.outputs.version }}.json"
          $manifest = @{
            version = "${{ steps.package.outputs.version }}"
            commit = "${{ github.sha }}"
            artifacts = @{
              windows = @{
                fileName = $installer.Name
                size = $installer.Length
                sha256 = $hash
              }
            }
          } | ConvertTo-Json -Depth 5
          $manifest | Set-Content -Path $manifestName -Encoding utf8NoBOM
          npx --yes wrangler@4.143.0 r2 object put "gamble-client-jars/$($installer.Name)" --file "$($installer.FullName)" --remote
          npx --yes wrangler@4.143.0 r2 object put "gamble-client-jars/release-manifests/$manifestName" --file "$manifestName" --remote

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gamble-client-launcher-windows-${{ steps.package.outputs.version }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            launcher-windows-${{ steps.package.outputs.version }}.json
          if-no-files-found: error
