app-id: org.gambleclient.Launcher
# GNOME 51 provides WebKitGTK 4.1, libsoup 3 and GTK 3 for the native Tauri
# launcher. It is based on org.freedesktop.Platform 26.08, so the Java 21
# extension must use that branch.
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk21
command: gamble-client-launcher
finish-args:
  - --share=network
  - --share=ipc
  # The launcher window is GTK/WebKitGTK and prefers Wayland. X11 stays granted
  # (not fallback-x11) so the Minecraft Java process can use Xwayland in Wayland
  # sessions when GLFW or a mod needs it, matching the deb/rpm launcher.
  - --socket=wayland
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=~/.minecraft:create
  - --filesystem=~/.local/share/gamble-client:create
  # Launcher updates are saved to the Downloads folder, as with the deb/rpm.
  - --filesystem=xdg-download
modules:
  - name: gamble-client-launcher
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk21/install.sh
      - install -Dm755 gamble-client-launcher-native /app/libexec/gamble-client-launcher
      - install -Dm755 gamble-client-launcher /app/bin/gamble-client-launcher
      - install -Dm644 org.gambleclient.Launcher.desktop /app/share/applications/org.gambleclient.Launcher.desktop
      - install -Dm644 org.gambleclient.Launcher.metainfo.xml /app/share/metainfo/org.gambleclient.Launcher.metainfo.xml
      - install -Dm644 org.gambleclient.Launcher.png /app/share/icons/hicolor/512x512/apps/org.gambleclient.Launcher.png
    sources:
      # The native Tauri launcher, built with `npm run tauri -- build --no-bundle`.
      - type: file
        path: ../src-tauri/target/release/gamble-client-launcher
        dest-filename: gamble-client-launcher-native
      - type: file
        path: gamble-client-launcher
      - type: file
        path: org.gambleclient.Launcher.desktop
      - type: file
        path: org.gambleclient.Launcher.metainfo.xml
      - type: file
        path: ../src-tauri/icons/icon.png
        dest-filename: org.gambleclient.Launcher.png
